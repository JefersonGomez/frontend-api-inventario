# Sirve la app de React. Las rutas del navegador (/products, /pos…) no son archivos:
# si no existe el archivo, devuelve index.html y React Router decide qué mostrar.
server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri /index.html;
  }

  # los archivos de /assets llevan un hash en el nombre: se pueden guardar en caché un año
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html nunca en caché: así cada despliegue se ve de inmediato
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
